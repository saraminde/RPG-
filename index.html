<style id="ui-refresh">
/* ===== 색감/질감만 변경 · 크기, 여백, 글자 크기, 배치는 원본 그대로 ===== */
:root{--bg:#f4f5f7;--surface:#fff;--ink:#171a21;--ink-2:#3b4252;--muted:#6b7280;--line:#e4e7ec;--line-2:#d3d8e0;--fill:#f6f7f9;--accent:#1f2a44;--accent-2:#2d3b5e;--danger:#c8403f;--hp:#d9534f;--sp:#3b78d8}
body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
::selection{background:#d9e0f2}
h1{font-weight:700;color:var(--ink-2)}

/* 상태 바 (색만) */
#hp,#stamina{border-radius:8px;background:#dde1e8;box-shadow:inset 0 0 0 1px rgba(23,26,33,.06)}
#hp{background:#ecd2d1}
#stamina{background:#d3deef}
#hpFill{background:var(--hp)}
#staminaFill{background:var(--sp)}
#hpText,#staminaText{text-shadow:0 1px 2px rgba(0,0,0,.45)}
#level{background:var(--surface);color:var(--ink-2);border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
#coins{color:#9a6a0b}
#exp{color:var(--muted)}
#mage-stones{background:#f6f1fc;color:#6d3fb3;border-radius:8px}

/* 메인 패널 */
#game-container{background:var(--surface);border-color:var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -12px rgba(16,24,40,.12)}
.log-entry{background:var(--fill);border-radius:10px;color:var(--ink-2)}
.log-critical{color:#d12f2f}
.max-level{color:#9a6a0b}

/* 버튼 */
.button{background:var(--surface);color:var(--ink);border-color:var(--line-2);border-radius:12px;box-shadow:0 1px 1px rgba(16,24,40,.04);transition:background .15s,border-color .15s,transform .12s}
.button:hover{filter:none;background:var(--fill);border-color:#b8c0cc;box-shadow:0 1px 1px rgba(16,24,40,.04);transform:none}
.button:active{background:#eceef2;transform:scale(.985);box-shadow:none}

/* 전투 버튼 (72px, 위치 동일) */
#combat-button{background:var(--accent);border:1px solid rgba(255,255,255,.35);box-shadow:0 10px 24px -6px rgba(16,24,40,.45),0 0 0 1px rgba(16,24,40,.08);backdrop-filter:none}
#combat-button:hover{background:var(--accent-2);box-shadow:0 14px 28px -6px rgba(16,24,40,.5),0 0 0 1px rgba(16,24,40,.08)}
#combat-button.disabled{background:#c5cad3;box-shadow:0 6px 14px -6px rgba(16,24,40,.3)}
#combat-button.hold-arming{box-shadow:0 0 0 5px rgba(45,59,94,.22),0 10px 24px -6px rgba(16,24,40,.45)}

/* 몬스터 / 지역 선택 */
#monster-info{background:#fcf4f3;border:0;box-shadow:inset 0 0 0 1px #f1d5d3;border-radius:10px;color:#5a1f1d}
.monster-hp{color:var(--danger)}
.monster-select-title{color:var(--ink)}
.monster-choice{background:var(--surface);border-color:var(--line-2);color:var(--ink);transition:background .15s,border-color .15s}
.monster-choice small{color:var(--muted)}
.monster-choice.unlocked:hover{transform:none;background:var(--fill);border-color:#b8c0cc}
.monster-choice.selected{background:#eef1f8;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* ===== 제로 디바이드(Transcendent) =====

@keyframes zd-shine{

.transcendent-name-effect.transcendent-weapon-effect{filter:drop-shadow(0 0 2px rgba(255,110,20,.55)) drop-shadow(0 0 8px rgba(255,90,0,.3))}
.transcendent-name-effect::before,.transcendent-name-effect::after{-webkit-text-fill-color:#FFB46E}
}
.inventory-still .transcendent-name-effect::before,.inventory-still .transcendent-name-effect::after{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.transcendent-name-effect,.transcendent-name-effect::before,.transcendent-name-effect::after{animation:none!important}}

 const open='<svg viewBox="0 '+vb[0]+' 120 '+vb[1]+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+name+'" class="'+(tw?'twisted':'')+'">';

}

function gdb(wp){const is=wp.name.includes('오로라 소드')||wp.name.includes('네크로맨서 원드');const tl=wp.transcend||0;if(is){if(tl>=20)return wp.name.includes('오로라 소드')?30:25;if(tl>=10)return 20;if(tl>=5)return 15;if(tl>0)return 10}return 20}

function craftEternalSword(){const need=voidWeapons.map(x=>x.name);const mats=need.map(name=>p.inventory.findIndex(it=>it.type==='weapon'&&it.rarity==='Void'&&it.name===name&&!it.isLocked));if(mats.some(ix=>ix===-1)){al('모든 종류의 Void급 무기 5종이 필요합니다: 보이드 사이드, 공허 지배자, 네뷸라 소드, 공허의 검, 혜성의 검');return}if(!confirm('모든 종류의 Void급 무기 5개를 합쳐 Eternal급 이터널 소드를 제작하시겠습니까?'))return;const items=mats.map(ix=>p.inventory[ix]);let best=items[0];for(const it of items.slice(1)){const score=(Number(it.enchantAttackPct)||0)+(Number(it.enchantCritPct)||0);const bscore=(Number(best.enchantAttackPct)||0)+(Number(best.enchantCritPct)||0);if(score>bscore||(score===bscore&&(Number(it.enchantAttackPct)||0)>(Number(best.enchantAttackPct)||0)))best=it}for(const name of need){const ix=p.inventory.findIndex(it=>it.type==='weapon'&&it.rarity==='Void'&&it.name===name&&!it.isLocked);if(ix!==-1)p.inventory.splice(ix,1)}const ea=Number(best.enchantAttackPct)||0;const ec=Number(best.enchantCritPct)||0;const nv={type:'weapon',name:'이터널 소드',damage:1500,rarity:'Eternal',upgrade:0,transcend:0,successChance:100,isDescended:false,isLocked:false,isPlated:false,isRainbow:false,enchantAttackPct:ea,enchantCritPct:ec};p.inventory.push(nv);al(`Eternal급 이터널 소드 제작 성공!${ea||ec?` 인첸트 계승: 공격력 +${ea}%, 치명타 +${ec}%`:''}`);sg();uu()}

const phase=()=>((((Date.now()-epoch)/1000)%CYCLE)+CYCLE)%CYCLE;   // 0~300 낮, 300~480 밤
const shifted=ph=>ph>=CYCLE-15?ph-CYCLE:ph;                       // 새벽 구간을 -15~15로

/* 밝기 L: 1=한낮, 0=한밤. 일출/일몰은 경계선 앞뒤 15초씩 부드럽게 */
const lightAt=x=>Math.min(ss(-15,15,x),1-ss(DAY_SEC-15,DAY_SEC+15,x));
/* 황금빛(노을/아침놀) 정도 */
const goldAt=x=>Math.max(Math.exp(-Math.pow(x/45,2)),Math.exp(-Math.pow((x-DAY_SEC)/50,2)));

/* 시간대별 색조 (multiply) */
function tintAt(x,C){
 const K=[[-15,C],[-4,[132,106,146]],[6,[255,206,168]],[26,[255,226,194]],[80,[255,252,244]],[235,[255,252,244]],[272,[255,214,164]],[300,[255,166,116]],[314,[124,94,132]],[338,C]];
 if(x<=K[0][0])return K[0][1];
 if(x>=K[K.length-1][0])return K[K.length-1][1];
 for(let i=0;i<K.length-1;i++){
  if(x<K[i+1][0]){const t=ss(K[i][0],K[i+1][0],x);return mixC(K[i][1],K[i+1][1],t)}
 }
 return C;
}

/* ---------- 레이어 만들기 ---------- */
const $=id=>document.getElementById(id);
const cloudEl=document.createElement('div');cloudEl.id='dn-cloud';
const tintEl=document.createElement('div');tintEl.id='dn-tint';
const fxEl=document.createElement('canvas');fxEl.id='dn-fx';
const rcEl=$('rn');   // 게임 캔버스를 감싼 요소 (채도/대비 보정용)
if(rcEl&&rcEl.parentNode===document.body){
 rcEl.insertAdjacentElement('afterend',fxEl);
 rcEl.insertAdjacentElement('afterend',tintEl);
 rcEl.insertAdjacentElement('afterend',cloudEl);   // 순서: 게임 → 구름그림자 → 색조 → 햇빛
}else{document.body.appendChild(cloudEl);document.body.appendChild(tintEl);document.body.appendChild(fxEl)}
const fx=fxEl.getContext('2d');

/* 구름 그림자 타일 (한 번만 생성, 이후엔 GPU 이동만) */
(function(){
 const N=128,c=document.createElement('canvas');c.width=c.height=N;
 const x=c.getContext('2d');if(!x)return;
 const img=x.createImageData(N,N);
 const h2=(i,j,s)=>{let h=Math.imul((i*374761393+j*668265263+s*982451653)|0,1274126177);h=(h^(h>>>13))>>>0;h=Math.imul(h,1274126177)>>>0;return (h&0xffff)/65535};
 const vn=(u,v,per,s)=>{
  const fx_=u*per,fy=v*per,i=Math.floor(fx_),j=Math.floor(fy),tx=fx_-i,ty=fy-j,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
  const a=h2(i%per,j%per,s),b=h2((i+1)%per,j%per,s),c2=h2(i%per,(j+1)%per,s),d=h2((i+1)%per,(j+1)%per,s);
  return lerp(lerp(a,b,sx),lerp(c2,d,sx),sy);
 };
 for(let py=0;py<N;py++)for(let px=0;px<N;px++){
  const u=px/N,v=py/N,n=vn(u,v,4,1)*.55+vn(u,v,8,2)*.3+vn(u,v,16,3)*.15,d=ss(.5,.74,n),k=(py*N+px)*4;
  img.data[k]=22;img.data[k+1]=44;img.data[k+2]=78;img.data[k+3]=d*215;
 }
 x.putImageData(img,0,0);
 try{cloudEl.style.backgroundImage='url('+c.toDataURL()+')'}catch(e){}
})();

/* ---------- 시계 표시 ---------- */
const clock=document.createElement('span');
clock.id='dn-clock';
clock.title='낮 5분 · 밤 3분';
clock.innerHTML='<span class="dn-track"><i class="dn-ico">\u2600\uFE0E</i></span>';
(function(){
 const host=document.getElementById('status-bar');
 
})();
/* 낮(주황)·밤(남색) 선 위로 해가 지나가고, 남색 구간에 들어가면 달로 바뀜 */
const icoEl=clock.querySelector('.dn-ico');
let hudKey='',icoNight=null,icoPos='';
function hud(ph,isNight){
 const pos=(ph/CYCLE*100).toFixed(2)+'%';
 if(pos!==icoPos){icoEl.style.left=pos;icoPos=pos}
 if(isNight!==icoNight){
  if(icoNight!==null){icoEl.classList.remove('pop');void icoEl.offsetWidth;icoEl.classList.add('pop')}
  icoNight=isNight;icoEl.textContent=isNight?'\u263E\uFE0E':'\u2600\uFE0E';icoEl.classList.toggle('moon',isNight);
 }
 const rem=Math.max(0,Math.ceil(isNight?CYCLE-ph:DAY_SEC-ph)),m=(rem/60)|0,s=rem%60,k=(isNight?'n':'d')+rem;
 if(k===hudKey)return;hudKey=k;
 clock.setAttribute('aria-label',(isNight?'밤':'낮')+' 남은 시간 '+m+'분 '+s+'초');
}

/* ---------- 지역별 적용 강도 (실내/우주/천국 등) ---------- */
const PROF={'공허':{sun:0,night:0},'천국의 문':{sun:1,night:.45}};   // 마왕성은 다른 지역과 같은 날씨 적용
const cur={sun:1,night:1,ember:0};

/* ---------- 햇빛 효과 (빛줄기 · 번짐 · 렌즈 플레어 · 먼지) ---------- */
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let cloudCover=0;   // 0~1 : 구름이 해를 가리는 정도 (가끔 구름이 지나갈 때만 올라감)
const cl={on:0,next:0,t0:0,dur:0,pk:0};
/* 빛줄기 텍스처: 가장자리가 부드럽고 끝으로 갈수록 사라지는 빛기둥 (색별로 한 번만 생성) */
const RT=new Map();
function rayTex(col){
 const k=(col[0]>>3)+','+(col[1]>>3)+','+(col[2]>>3);let c=RT.get(k);if(c)return c;
 c=document.createElement('canvas');c.width=48;c.height=256;const x=c.getContext('2d');
 let g=x.createLinearGradient(0,0,48,0);
 [[0,0],[.2,.16],[.38,.68],[.5,1],[.62,.68],[.8,.16],[1,0]].forEach(q=>g.addColorStop(q[0],rgb(col,q[1])));
 x.fillStyle=g;x.fillRect(0,0,48,256);
 x.globalCompositeOperation='destination-in';g=x.createLinearGradient(0,0,0,256);
 [[0,0],[.06,1],[.3,.75],[.6,.3],[.85,.07],[1,0]].forEach(q=>g.addColorStop(q[0],'rgba(0,0,0,'+q[1]+')'));
 x.fillStyle=g;x.fillRect(0,0,48,256);
 if(RT.size>40)RT.clear();RT.set(k,c);return c;
}
let fxW=0,fxH=0,fxClear=true;
function sizeFx(){
 const w=Math.max(2,Math.ceil(innerWidth/2)),h=Math.max(2,Math.ceil(innerHeight/2));
 if(w!==fxW||h!==fxH){fxW=fxEl.width=w;fxH=fxEl.height=h}
}
/* 마왕성: 불씨가 떠다님 */
const EMB=[];let embT=0;
function newEmber(W,H,init){const mx=4+Math.random()*5;return{x:Math.random()*W,y:init?Math.random()*H:H*(.7+Math.random()*.45),vx:(Math.random()-.5)*16,vy:-(16+Math.random()*34),r:.9+Math.random()*1.7,ph:Math.random()*6.28,life:init?Math.random()*mx:0,max:mx}}
function drawEmbers(t,a,cam,Z){
 const W=innerWidth,H=innerHeight,dt=Math.min(.1,Math.max(0,t-embT));embT=t;
 const n=window.__cfg.lite?12:34;
 while(EMB.length<n)EMB.push(newEmber(W,H,true));if(EMB.length>n)EMB.length=n;
 fx.save();fx.globalCompositeOperation='lighter';
 for(const e of EMB){
  e.life+=dt;e.x+=(e.vx+Math.sin(t*1.4+e.ph)*13)*dt;e.y+=e.vy*dt;
  if(e.life>e.max||e.y<-12||e.x<-20||e.x>W+20){Object.assign(e,newEmber(W,H,false));continue}
  const f=Math.sin(Math.PI*Math.min(1,e.life/e.max)),fl=.7+.3*Math.sin(t*9+e.ph*3),al=a*f*fl;
  if(al<=.01)continue;
  fx.fillStyle=rgb([255,110,40],.22*al);fx.beginPath();fx.arc(e.x,e.y,e.r*3.4,0,6.2832);fx.fill();
  fx.fillStyle=rgb([255,176,84],.9*al);fx.beginPath();fx.arc(e.x,e.y,e.r,0,6.2832);fx.fill();
  fx.fillStyle=rgb([255,236,190],.9*al);fx.beginPath();fx.arc(e.x,e.y,e.r*.45,0,6.2832);fx.fill();
 }
 fx.restore();
}
function drawFx(t,day,gold,u,cam,Z,lamp,emb){
 sizeFx();
 fx.setTransform(1,0,0,1,0,0);fx.clearRect(0,0,fxW,fxH);
 fx.setTransform(.5,0,0,.5,0,0);
 if(day>=.01&&!window.__cfg.lite)drawSun(t,day,gold,u);
 if(lamp>.01)drawLamps(t,lamp,cam,Z);
 if(emb>.01)drawEmbers(t,emb,cam,Z);
}
/* 밤 가로등 불빛 (색조 레이어 위에 그려서 실제로 빛나 보이게) */
function drawLamps(t,on,cam,Z){
 const ls=window.__lamps;if(!ls||!ls.length||!rcEl||getComputedStyle(rcEl).display==='none')return;
 const W=innerWidth,H=innerHeight;
 for(const d of ls){
  const x=W/2+(d[1]-cam.x)*Z,y=H*.42+(d[2]-44-cam.y)*Z,r=95*Z;
  if(x<-r||x>W+r||y<-r||y>H+r*1.5)continue;
  const fl=.92+.08*Math.sin(t*3+d[1]),A=on*fl;
  let g=fx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgb([255,226,160],.55*A));g.addColorStop(.25,rgb([255,200,120],.22*A));g.addColorStop(1,rgb([255,180,100],0));
  fx.fillStyle=g;fx.fillRect(x-r,y-r,r*2,r*2);
  const gy=y+44*Z;fx.save();fx.translate(x,gy);fx.scale(1,.45);
  g=fx.createRadialGradient(0,0,0,0,0,r*.9);g.addColorStop(0,rgb([255,214,140],.2*A));g.addColorStop(1,rgb([255,190,110],0));
  fx.fillStyle=g;fx.beginPath();fx.arc(0,0,r*.9,0,6.2832);fx.fill();fx.restore();
 }
}
function drawSun(t,day,gold,u){
 const W=innerWidth,H=innerHeight;
 const power=day*SUN_POWER;
 const sunE=Math.sin(Math.PI*clamp(u,0,1));                     // 태양 고도
 const sx=W*(.1+.8*u),sy=-H*(.28+.3*(1-sunE));                   // 태양 위치 (화면 밖 위쪽 · 보이지 않음)
 const col=mixC([255,246,222],[255,172,98],gold);               // 햇빛 색
 const breathe=1+.03*Math.sin(t*.31)+.02*Math.sin(t*.77+1.2);
 const A=power*breathe*(1-.6*cloudCover);   // 구름에 가려지면 덜 빛남

 /* 1) 전체를 감싸는 따뜻한 공기 */
 fx.fillStyle=rgb(mixC([255,240,205],[255,196,130],gold),.05*A+.03*gold*A);
 fx.fillRect(0,0,W,H);

 /* 2) 태양 번짐 (블룸) */
 const R=Math.max(W,H)*.95;
 let g=fx.createRadialGradient(sx,sy,0,sx,sy,R);
 g.addColorStop(0,rgb([255,250,230],.62*A));
 g.addColorStop(.07,rgb(col,.40*A));
 g.addColorStop(.30,rgb(col,.17*A));
 g.addColorStop(.65,rgb(col,.06*A));
 g.addColorStop(1,rgb(col,0));
 fx.fillStyle=g;fx.fillRect(0,0,W,H);

 /* 3) 빛줄기: 부드러운 빛기둥이 천천히 흔들림. 아래로 갈수록 사라지고, 구름이 끼면 가장 먼저 사라짐 */
 const rA=power*breathe*Math.pow(1-cloudCover,2)*(.55+.25*(1-sunE)+.45*gold);
 if(rA>.004){
  const tex=rayTex(col),N=11,base=Math.atan2(H*.62-sy,W*.5-sx);
  for(let i=0;i<N;i++){
   const a0=base+(i-(N-1)/2)*.13+Math.sin(t*.05+i*2.3)*.035+((i*53)%7-3)*.012,sa=Math.sin(a0);
   if(sa<.15)continue;
   const fl=.5+.5*Math.sin(t*.23+i*1.9)*Math.sin(t*.11+i*.7+1.3);
   const len=(H*.95-sy)/sa,wd=len*(.05+.05*(((i*37)%5)/5));
   fx.save();fx.translate(sx,sy);fx.rotate(a0-Math.PI/2);fx.globalAlpha=clamp(rA*(.14+.26*fl),0,1);
   fx.drawImage(tex,-wd/2,0,wd,len);fx.restore();
  }
  fx.globalAlpha=1;
 }

 /* 4) 해 쪽으로 은은하게 번지는 가로 빛 */
 fx.save();fx.translate(sx,sy);fx.scale(1,.06);
 g=fx.createRadialGradient(0,0,0,0,0,W*.7);
 g.addColorStop(0,rgb([255,244,214],.12*A));g.addColorStop(1,rgb(col,0));
 fx.fillStyle=g;fx.beginPath();fx.arc(0,0,W*.7,0,6.2832);fx.fill();fx.restore();
}

/* ---------- 메인 루프 ---------- */
let last=performance.now(),tGrade=0,tFx=0,lastFilter='',lastCss='';
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.1,(now-last)/1000);last=now;
 const ph=phase(),x=shifted(ph),isNight=ph>=DAY_SEC;
 const hook=window.__trpg,cam=hook?hook.cam:{x:0,y:0},Z=hook?hook.Z():1;
 const rg=hook&&hook.R&&hook.R.rg?hook.R.rg:'숲',tgt=PROF[rg]||{sun:1,night:1};
 cur.sun+=(tgt.sun-cur.sun)*Math.min(1,dt*3);cur.night+=(tgt.night-cur.night)*Math.min(1,dt*3);
 cur.ember+=((rg==='마왕성'?1:0)-cur.ember)*Math.min(1,dt*2.5);

 const L=lightAt(x),gold=goldAt(x)*ss(0,.3,L);
 const day=L*cur.sun,nightAmt=(1-L)*cur.night,k=clamp(day+nightAmt,0,1);
 const T=RM?0:now/1000;

 /* 색조 · 비네팅 · 채도/대비 (약 20Hz) */
 if(now-tGrade>50){
  tGrade=now;
  const C=mixC(WHITE,[28,38,92],NIGHT_DARKNESS),cd=cloudCover*day,cm=mixC(WHITE,[214,222,238],cd*.7),t0_=mixC(WHITE,tintAt(x,C),k),tint=[t0_[0]*cm[0]/255,t0_[1]*cm[1]/255,t0_[2]*cm[2]/255];
  const vig=lerp(.52*NIGHT_DARKNESS+.06,.16,L)*k;
  const css='radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 52%,'+rgb([4,6,22],vig)+' 140%) '+rgb(tint);
  if(css!==lastCss){tintEl.style.background=css;lastCss=css}
  if(USE_FILTER&&rcEl&&window.__cfg.lite){if(lastFilter!==''){rcEl.style.filter='';lastFilter=''}}else if(USE_FILTER&&rcEl){
   const sat=lerp(1,lerp(1-.30*NIGHT_DARKNESS,1.18,L),k)*(1-.12*cd),con=lerp(1,lerp(1.04,1.08,L),k)*(1-.03*cd),bri=lerp(1,lerp(1-.2*NIGHT_DARKNESS,1.03,L),k)*(1-.04*cd);
   const f=(Math.abs(sat-1)+Math.abs(con-1)+Math.abs(bri-1)<.004)?'':'saturate('+sat.toFixed(3)+') contrast('+con.toFixed(3)+') brightness('+bri.toFixed(3)+')';
   if(f!==lastFilter){rcEl.style.filter=f;lastFilter=f}
  }
  /* 텍스트 화면 패널도 밤에 맞춰 어둡게 */
  const rs=document.documentElement.style,n=clamp(nightAmt,0,1);
  rs.setProperty('--dn-panel',rgb(mixC(WHITE,[146,154,190],n),lerp(.7,.84,n)));
  rs.setProperty('--dn-bar',rgb([146,154,190],.84*n));
  rs.setProperty('--dn-exp',rgb(mixC([107,114,128],[22,26,44],n)));
  hud(ph,isNight);
 }

 /* 구름이 해를 가림: 30~80초마다 한 번, 8~18초 동안 천천히 지나감 */
 if(!cl.next)cl.next=now+(20+Math.random()*30)*1000;
 if(!cl.on&&now>cl.next){cl.on=1;cl.t0=now;cl.dur=(8+Math.random()*10)*1000;cl.pk=.5+Math.random()*.45}
 let ct=0;
 if(cl.on){const p=(now-cl.t0)/cl.dur;if(p>=1){cl.on=0;cl.next=now+(30+Math.random()*50)*1000}else ct=cl.pk*ss(0,.28,p)*(1-ss(.68,1,p))*(.85+.15*Math.sin((now-cl.t0)/1000*1.3))}
 cloudCover+=(ct-cloudCover)*Math.min(1,dt*1.5);
 cloudEl.style.opacity='0';   // 화면 전체가 어두워지던 떠다니는 그림자 제거

 /* 건물·나무 그림자 정보 (게임 캔버스가 읽어감) */
 {const uu_=clamp(x/DAY_SEC,0,1),e_=2*uu_-1;
  const lo_=Math.abs(e_),hf_=lo_*lo_*(3-2*lo_);
  window.__sunShadow={k:e_*.75,l:.06+.52*lo_,a:clamp(.3*day*(1-.8*cloudCover)*(.06+.94*hf_),0,.32)};}

 /* 햇빛 효과 (약 30fps) */
 window.__lampOn=clamp(1-L,0,1);
 if(now-tFx>32){tFx=now;drawFx(T,day,gold,clamp(x/DAY_SEC,0,1),cam,Z,window.__lampOn,cur.ember)}
}
requestAnimationFrame(frame);

/* 콘솔에서 시간 조절: dayNight.set('day') / dayNight.set('night') / dayNight.set(초) */
window.dayNight={
 DAY_SEC:DAY_SEC,NIGHT_SEC:NIGHT_SEC,
 cloud:(pk,sec)=>{cl.on=1;cl.t0=performance.now();cl.dur=(sec||14)*1000;cl.pk=pk||.85},
 get:()=>{const ph=phase();return{phase:ph,isDay:ph<DAY_SEC,remaining:ph<DAY_SEC?DAY_SEC-ph:CYCLE-ph}},
 set:v=>{
  let t=typeof v==='number'?v:(v==='night'||v==='밤')?DAY_SEC+30:(v==='dusk'||v==='노을')?DAY_SEC-20:(v==='dawn'||v==='새벽')?CYCLE-14:(v==='noon'||v==='정오')?DAY_SEC/2:25;
  t=((t%CYCLE)+CYCLE)%CYCLE;epoch=Date.now()-t*1000;
  try{localStorage.setItem(KEY,String(epoch))}catch(e){}
 }
};
})();
</script>

<script>
/* 훈련 결과 알림창: 훈련 전/후로 바뀐 능력치를 보여줌 */
(function(){
 var pop=null,box=null;
 function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function build(){
  if(pop)return;
  pop=document.createElement('div');pop.id='train-pop';
  pop.innerHTML='<div id="train-box" role="alertdialog" aria-modal="true"></div>';
  document.body.appendChild(pop);box=pop.firstChild;
  pop.addEventListener('click',function(e){if(e.target===pop)close()});
  document.addEventListener('keydown',function(e){if(pop.classList.contains('on')&&(e.key==='Enter'||e.key==='Escape'||e.key===' ')){e.preventDefault();e.stopPropagation();close()}},true);
 }
 function close(){if(pop)pop.classList.remove('on')}
 function show(title,rows,cost,note){
  build();
  var h='<div class="tp-title">'+esc(title)+'</div>';

   }catch(e){console.error(e)}
   return r;
  };
 }

#sp-pv{display:block;width:150px;height:150px;margin:2px auto 8px;box-sizing:border-box;border:3px solid var(--grade-edge,#0a1f5e);border-radius:18px;background:radial-gradient(120% 95% at 50% 30%,var(--grade-light,#5cc0ff) 0%,var(--grade-bg,#2a86f5) 52%,var(--grade-dark,#1857c9) 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.38),inset 0 -6px 9px rgba(0,0,0,.28),0 4px 0 rgba(0,0,0,.2);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

.sp-row{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;border-top:1px dashed #ddd;font-size:13px}
.sp-row b{color:#444}.sp-row span{text-align:right;font-weight:700}
.up{color:#1a9a4a}.down{color:#d33}
#sp-btns{display:flex;gap:8px;margin-top:12px}
#sp-btns button{flex:1;min-height:44px;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;border:2px solid #222}
#sp-eq{background:#4CAF50;color:#fff}#sp-del{background:#fff;color:#c8403f;border-color:#c8403f}

 g.fillStyle=G(18,70,P.m2,P.m);g.beginPath();g.moveTo(30,20);g.quadraticCurveTo(50,30,70,20);g.lineTo(80,30);g.lineTo(72,48);g.lineTo(70,66);g.quadraticCurveTo(50,74,30,66);g.lineTo(28,48);g.lineTo(20,30);g.closePath();g.fill();g.stroke();
 g.fillStyle=P.t;g.beginPath();g.ellipse(50,22,9,4.5,0,0,6.3);g.fill();

var pop,raf=0,cur=null;

 else if(it.enchantDefensePct||it.enchantEvadePct)h+=row('인첸트','방어력 +'+Math.round(it.enchantDefensePct||0)+'% · 회피 +'+Math.round(it.enchantEvadePct||0)+'%');

  if(p.weapon)delete p.weapon.count;if(p.armor)delete p.armor.count;al(st(gdn(it))+' 장착!');closePop();saveCombatResult();ri();uu()};

/* 버튼: 반투명 검정 · 얇은 흰 테두리 · 그림자 없음 */
.button,.monster-choice,.inventory-tab,.inv-chip,.inv-btn,.inv-del-all,.cv-tabs button,.cv-actions button,#set-box .sp-close,#rpanel .rpx,#sp-btns button,#close-inventory,.sp-code-go{background:var(--g-btn)!important;color:#fff!important;border:1px solid var(--g-bd)!important;border-radius:10px!important;box-shadow:none!important;text-shadow:none!important;font-weight:700;outline:0!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .12s,border-color .12s,transform .1s!important}
.button:hover,.monster-choice:hover,.inventory-tab:hover,.inv-chip:hover,.inv-btn:hover,.cv-tabs button:hover,.cv-actions button:hover{background:var(--g-btn-h)!important;border-color:rgba(255,255,255,.4)!important;transform:none!important;filter:none!important}
.button:active,.monster-choice:active,.inventory-tab:active,.inv-chip:active,.inv-btn:active,#sp-btns button:active,.cv-tabs button:active,.cv-actions button:active{background:rgba(255,255,255,.2)!important;transform:scale(.98)!important}
.button small,.monster-choice small{color:var(--muted)!important}
/* 선택됨/강조: 흰 테두리 + 살짝 밝은 유리 */
.inventory-tab.active,.inv-chip.active,.monster-choice.selected,#ptbtn.on{background:rgba(255,255,255,.2)!important;border-color:#fff!important;color:#fff!important;box-shadow:none!important}
#inventory-tabs{background:rgba(10,14,24,.94)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* 주요 / 위험 버튼 */
#drop-ok,#train-ok,#cv-apply,#sp-eq{background:rgba(255,255,255,.18)!important;color:#fff!important;border:1px solid rgba(255,255,255,.55)!important;box-shadow:none!important;border-radius:10px!important}
.inv-del,.inventory-item .inv-del,#sp-del,.inv-del-all{background:var(--g-btn)!important;color:#ff9792!important;border:1px solid rgba(255,143,138,.45)!important;outline:0!important}
.inv-del-all:disabled,#sp-btns button:disabled{opacity:.35}
/* 좌우 아이콘 버튼 */
#main-menu.home-grid .button,#ptbtn{background:var(--u-pill)!important;border:1px solid rgba(255,255,255,.2)!important;box-shadow:none!important;color:#fff!important;border-radius:12px!important}
#main-menu.home-grid .button svg,#ptbtn svg{stroke:#fff}
/* 입력 */
select,input[type=text],input[type=number],textarea,.sp-code-in{background:rgba(255,255,255,.08)!important;color:#fff!important;border:1px solid var(--g-bd)!important;border-radius:9px!important}
select option{background:#151a28;color:#fff}
/* 인벤토리 내부 */
#inventory-content h2,#inventory-content h3,.inventory-section-title{color:#fff!important}
#inventory-content .inventory-section-title{border-left-color:#8ec5ff}
#close-inventory{background:transparent!important;border-color:transparent!important;color:#fff!important}
.inventory-item,.skill-equipped,.inventory-empty,.rift-upgrade-row,.inv-tools,.cv-section{background:var(--fill)!important;color:#fff!important;border:1px solid var(--line)!important;box-shadow:none!important}
.inv-tools{background:transparent!important;border:0!important}
details.inv-clean{background:var(--fill)!important;border:1px dashed rgba(255,255,255,.22)!important}
details.inv-clean>summary{color:#ff9792!important}
.inv-clean label.chk,.inv-clean-note,.inv-tools-row>label,.skill-desc,.enhance-note,.small,.rift-upgrade-sub,.cv-section label,.custom-visual-box p{color:var(--muted)!important}
.slot.empty{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.22)!important}
#inventory-tabs .inventory-tab,#inventory-tabs .inventory-tab.active{text-shadow:none!important;box-shadow:none!important}
/* 장비 팝업 */
#sp-name{color:#fff}#sp-tag{color:var(--muted)!important}
.sp-row{border-top:1px dashed rgba(255,255,255,.2)!important;color:#fff}.sp-row b{color:var(--muted)!important}
#sp-x{color:#fff!important}
/* 훈련/설정/드롭 팝업 내부 */
#drop-box .dp-note,#train-box .tp-note{background:var(--u-sub)!important;color:#e8ecf5!important}
#drop-box,#train-box,#set-box,#rpanel,.custom-visual-box{color:#fff}
#rpanel .rpt,#drop-box .dp-title,#train-box .tp-title,#set-box .sp-title,.custom-visual-box h2{color:#fff!important}
#set-box .sp-val{background:rgba(255,255,255,.12);color:#fff}
#set-box input[type=range]{background:linear-gradient(90deg,#8ec5ff var(--p,50%),rgba(255,255,255,.2) var(--p,50%))}
/* 상호작용 버튼(건물 입장 등) */
#rint{background:rgba(10,14,24,.82)!important;border:1px solid rgba(255,255,255,.4)!important;box-shadow:none!important;border-radius:12px!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* 인벤토리 스크롤: 모바일 주소창 때문에 잘리던 문제 */
#inventory-modal{top:0;left:0;right:0;bottom:0;width:auto;height:auto;overflow:hidden}
#inventory-content{max-height:calc(100% - 28px)!important;margin:14px auto!important;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))!important}
#inventory-list::after{content:"";display:block;height:24px}
/* 메뉴 화면 뒤 큰 패널 (낮/밤 변수로 흰색이 들어오던 곳) */
body.bg:not(.world) #game-container{background:rgba(10,14,24,.72)!important;border:1px solid rgba(255,255,255,.12)!important;-webkit-backdrop-filter:blur(8px)!important;backdrop-filter:blur(8px)!important;color:#fff!important}
body.bg:not(.world) #game-container *{border-color:inherit}
#coin-rush-info{background:var(--fill)!important;border:1px solid rgba(255,215,106,.45)!important;color:#fff!important}
#monster-info{background:rgba(255,120,110,.1)!important;color:#fff!important;box-shadow:inset 3px 0 0 #ff8f8a!important}
.monster-hp{color:#ff9792!important}.monster-select-title{color:#fff!important}
/* 탐험 버튼 / 조이스틱 / 공격·대시·스킬 */
#combat-button,#combat-button.disabled{background:rgba(10,14,24,.7)!important;border:1px solid rgba(255,255,255,.4)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#combat-button:hover{background:rgba(255,255,255,.16)!important}
#ratk,#rskill,#rdash{background:rgba(10,14,24,.6)!important;border:2px solid rgba(255,255,255,.55)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#ratk.on,#rskill.on,#rdash.on{background:rgba(255,255,255,.28)!important}
#rbase{background:rgba(10,14,24,.4)!important;border-color:rgba(255,255,255,.5)!important}
#rknob{background:rgba(255,255,255,.7)!important}
/* JS가 인라인으로 흰색을 넣은 박스/버튼 */
[style*="background:#f"],[style*="background: #f"]{background:var(--fill)!important;color:#fff!important;border-color:rgba(255,255,255,.22)!important}
[style*="color:#171a21"],[style*="color:#3b4252"],[style*="color:#444"],[style*="color:#333"]{color:#fff!important}
[style*="background:#fff;border-radius:16px"]{background:var(--u-card)!important}
.slot-wrap,.slot-wrap span{color:#fff!important}
/* JS가 만든 안내 박스 (인라인 흰색) */
#monster-select>div:not(.monster-select-title):not([class]),#rpanel>div:not(.rpt):not([class]){background:var(--fill)!important;color:#fff!important;border-color:rgba(255,255,255,.22)!important}
[style*="rgb(255, 250, 240)"],[style*="rgb(255, 247, 247)"],[style*="rgb(255, 255, 255)"]{background:var(--fill)!important;color:#fff!important;border-color:rgba(255,255,255,.22)!important}
/* 어두운 배경에서 읽히도록 등급 글자색 밝게 */
body .grade-D{color:#e0a869}body .grade-C{color:#c9d1dc}body .grade-B{color:#7cc4ff}body .grade-A{color:#f7c948}body .grade-S{color:#c79bff}body .grade-SSS{color:#f08fff}body .grade-Void{color:#a98bff}
#set-box .sp-row{background:var(--fill)!important;border:1px solid var(--line)!important;color:#fff}
#set-box .sp-sw{background:rgba(255,255,255,.22)}#set-box .sp-sw.on{background:var(--u-acc)}
#slot-card{border:1px solid rgba(255,255,255,.2)!important;border-radius:18px!important;max-height:calc(100dvh - 32px)}
#slot-card::before{display:none!important}
#slot-pop{background:rgba(0,0,0,.55)}

/* 월드 화면: 필터가 걸리면 안의 고정 버튼 위치가 밀리므로 제거 */
body.world #game-container,body.world #game-container *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.world #game-container{border:0!important;box-shadow:none!important}
/* 체력/행동력: 회색 상자 제거, 글씨 흰색 + 빛번짐 제거 */
#hp,#stamina{background:none!important;box-shadow:none!important;border:0!important}
#hpText,#staminaText,#hpText *,#staminaText *{color:#fff!important;text-shadow:none!important;-webkit-text-stroke:0!important;filter:none!important}
#hp .vbar{background:rgba(255,59,59,.3)!important}
#stamina .vbar{background:rgba(41,178,246,.3)!important}
</style>
</body>
</html>
